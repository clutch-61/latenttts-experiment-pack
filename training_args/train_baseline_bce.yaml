# B1: BCE LatentRM, no order preference (loss-form control vs B0 CE / O2)
run_name: "baseline_bce"
metric_for_best_model: "test_n_64_recall_at_1"
output_dir: "outputs/latentrm_baseline_bce"
loss_type: "bce"

model_id: "checkpoints/coconut"
generator_model_id: "checkpoints/coconut"
model_type: "coconut"
model_family: "gpt2"

train_dataset: "latent-data/coconut/train"
valid_dataset:
  "test_n_64": "latent-data/coconut/valid-64"
  "test_n_4": "latent-data/coconut/valid-4"

seed: 42
# BCE = one traj / sample (unlike CE group). 512×4 ≈ high throughput; OOM → drop to 256.
per_device_train_batch_size: 512
per_device_eval_batch_size: 512
gradient_accumulation_steps: 1
optim: "paged_adamw_8bit"
lr_scheduler_type: "cosine"
warmup_ratio: 0.1
max_grad_norm: 1.0
num_train_epochs: 30
early_stopping_patience: 24
eval_frequency: 4
learning_rate: 1.0e-4
bf16: true
save_only_model: false
save_total_limit: 12
logging_steps: 5
report_to: "none"
