# Hard-only P3→P1: dualBeat annotate with correct_frac<=0.5 + light coconut replay.
# Warm start from O2 best (not failed O2op). Select on dualBeat valid-64.
run_name: "order_pref_onpolicy_hard"
metric_for_best_model: "test_n_64_recall_at_1"
output_dir: "outputs/latentrm_order_pref_hard"
loss_type: "bce"

model_id: "outputs/latentrm_order_pref/best"
generator_model_id: "checkpoints/coconut"
model_type: "coconut"
model_family: "gpt2"

train_dataset: "latent-data/onpolicy_hard_mix/train"
valid_dataset:
  "test_n_64": "latent-data/dualBeat/valid-64"
  "coconut_n_64": "latent-data/coconut/valid-64"

pref_lambda: 0.5
order_margin: 0.05
hierarchy_margin: 0.0125
lambda_hier: 1.0
pref_score_reduce: "mean_log_prob"
corruption_names: "adjacent_swap,segment_swap,multi_segment,full_reverse"
pref_on_correct_only: true

seed: 42
per_device_train_batch_size: 128
per_device_eval_batch_size: 512
gradient_accumulation_steps: 4
optim: "paged_adamw_8bit"
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
max_grad_norm: 1.0
num_train_epochs: 4
early_stopping_patience: 8
eval_frequency: 4
learning_rate: 2.0e-5
bf16: true
save_only_model: false
save_total_limit: 4
logging_steps: 5
report_to: "none"
